name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  oxfmt:
    name: Oxfmt
    permissions:
      contents: read
    uses: yuyuyuyuyu-dev/repo-config/.github/workflows/oxfmt.yml@main

  kotlin-lint:
    name: Kotlin lint
    permissions:
      contents: read
    uses: yuyuyuyuyu-dev/repo-config/.github/workflows/kotlin-lint.yml@main
    with:
      jdk-distribution: zulu
      jdk-version: "21"

  web:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Prettier (web assets)
            command: npx --no -- prettier --check plugin/src/main/resources "test-projects/web-app/*.html"
          - name: ESLint (JS & JSON)
            command: npx --no -- eslint plugin/src/main/resources
          - name: HTMLHint (HTML)
            command: npx --no -- htmlhint "test-projects/web-app/*.html"
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  actions:
    name: actionlint (GitHub Actions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Lint workflows with actionlint
        uses: raven-actions/actionlint@v2
