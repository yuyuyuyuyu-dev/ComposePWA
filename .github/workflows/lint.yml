name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  kotlin:
    name: ktlint, Detekt & version catalog (Gradle)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5.7.0
        with:
          java-version: "21"
          distribution: "jetbrains"
        # The JetBrains distribution resolves its version via the GitHub API;
        # authenticate so it isn't throttled by the 60 req/hour/IP limit.
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Lint Kotlin (Gradle plugin)
        run: ./gradlew :plugin:ktlintCheck :plugin:detekt

      # versionCatalogFormat rewrites the catalog in place and has no check
      # mode, so the diff against the committed file is the assertion.
      - name: Check version catalog formatting
        run: |
          ./gradlew versionCatalogFormat
          git diff --exit-code gradle/libs.versions.toml

  # Each checker gets its own job so that a push that violates several of them reports
  # every violation at once instead of stopping at the first tool.
  web:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Prettier (web assets)
            command: npx --no -- prettier --check .
          - name: ESLint (JS, JSON & YAML)
            command: npx --no -- eslint .
          # HTMLHint has no ignore-file mechanism of any kind, so what it skips can only
          # be said on the command line.
          - name: HTMLHint (HTML)
            command: npx --no -- htmlhint "**/*.html" --ignore
              "**/build/**,**/node_modules/**,tmp/**,example/**,test-projects/web-app/src/**"
          - name: markdownlint (Markdown)
            command: npx --no -- markdownlint-cli2
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # `npx --no` fails when the tool is missing from node_modules instead of quietly
      # fetching a different version from the registry.
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  actions:
    name: actionlint (GitHub Actions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Lint workflows with actionlint
        uses: raven-actions/actionlint@v2
