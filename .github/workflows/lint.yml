name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  gradle:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ktlint (Kotlin)
            command: ./gradlew :plugin:ktlintCheck
          - name: Detekt (Kotlin)
            command: ./gradlew :plugin:detekt
          - name: version-catalog-update (version catalog)
            command: ./gradlew versionCatalogFormat && git diff --exit-code gradle/libs.versions.toml
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: "21"
          distribution: "jetbrains"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  web:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Prettier (web assets)
            command: npx --no -- prettier --check .
          - name: ESLint (JS, JSON & YAML)
            command: npx --no -- eslint .
          - name: HTMLHint (HTML)
            command: npx --no -- htmlhint "**/*.html" --ignore
              "**/build/**,**/node_modules/**,tmp/**,example/**,test-projects/web-app/src/**"
          - name: markdownlint (Markdown)
            command: npx --no -- markdownlint-cli2
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  actions:
    name: actionlint (GitHub Actions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Lint workflows with actionlint
        uses: raven-actions/actionlint@v2
