name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  biome:
    name: Biome
    permissions:
      contents: read
    uses: yuyuyuyuyu-dev/repo-config/.github/workflows/biome.yml@main

  kotlin-lint:
    name: Kotlin lint
    permissions:
      contents: read
    uses: yuyuyuyuyu-dev/repo-config/.github/workflows/kotlin-lint.yml@main
    with:
      compose-multiplatform: true

  assets-for-users:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Prettier (assets for users)
            command: npm run prettier -- --check plugin/src/main/resources/manifest.json plugin/src/main/resources/registerServiceWorker.js plugin/src/main/resources/workbox-config-for-js.js plugin/src/main/resources/workbox-config-for-wasm.js "test-projects/web-app/*.html"
          - name: ESLint (assets for users)
            command: npm run eslint -- plugin/src/main/resources/manifest.json plugin/src/main/resources/registerServiceWorker.js plugin/src/main/resources/workbox-config-for-js.js plugin/src/main/resources/workbox-config-for-wasm.js
          - name: HTMLHint (assets for users)
            command: npm run htmlhint -- "test-projects/web-app/*.html"
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  actions:
    name: actionlint (GitHub Actions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Lint workflows with actionlint
        uses: raven-actions/actionlint@v2
